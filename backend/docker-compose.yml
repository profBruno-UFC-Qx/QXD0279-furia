services:
  db:
    container_name: avaliae_db
    image: postgres:15
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - avaliae:/var/lib/postgresql/data

  minio:
    image: minio/minio
    container_name: avaliae_storage
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  minio-setup:
    image: minio/minio
    container_name: avaliae_storage_setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 10;
      mc alias set localminio http://minio:9000 admin admin123;
      mc mb localminio/avaliae-docs --ignore-existing;
      mc anonymous set download localminio/avaliae-docs;
      "

volumes:
  avaliae:
  minio_data: